
name: CI - Autos Varela

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore TallerMecanicoWeb/TallerMecanicoWeb.slnx

      - name: Compilar solucion
        run: dotnet build TallerMecanicoWeb/TallerMecanicoWeb.slnx --configuration Release --no-restore

      - name: Ejecutar pruebas unitarias
        run: dotnet test TallerMecanicoWeb.Tests/TallerMecanicoWeb.Tests.csproj --configuration Release --no-restore
